worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High Concurrency Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Gzip Compression to minimize bandwidth & latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate Limiting (Protects from sudden DDoS bursts while allowing 100 queries/sec)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Upstream Microservice Clusters with Least-Connection Load Balancing
    upstream patient_cluster {
        least_conn;
        server patient-service:8001 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream doctor_cluster {
        least_conn;
        server doctor-service:8002 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream bed_cluster {
        least_conn;
        server bed-service:8003 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream pharmacy_cluster {
        least_conn;
        server pharmacy-service:8004 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream billing_cluster {
        least_conn;
        server billing-service:8005 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conn_limit 100;

        # Static Web UI Caching
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Microservice API Routes with Circuit Breaker Buffering
        location /api/patients/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://patient_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/doctors/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://doctor_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/beds/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://bed_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/pharmacy/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://pharmacy_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/billing/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://billing_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}

